openapi: 3.0.3
info:
  title: SentinelDev Mock API
  version: 1.0.0
  description: >
    Mock API for the SentinelDev demo testbed. NOTE: POST /report is intentionally absent — DocuSync will detect and add
    it.
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /users:
    get:
      summary: List all users
      operationId: getUsers
      tags:
        - Users
      responses:
        '200':
          description: A list of users with hashed IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: u-001
                        name:
                          type: string
                          example: Alice
                        hashedId:
                          type: string
                          example: 5f4dcc3b5aa765d61d8327de...
  /report:
    post:
      summary: POST /report
      operationId: postreport
      tags:
        - report
      responses:
        '200':
          description: Success
